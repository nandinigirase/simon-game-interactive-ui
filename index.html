<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Simon Game</h1>
            <p class="instructions">Watch the sequence, then repeat it!</p>
        </header>

        <div class="controls">
            <div class="difficulty-selector">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="restartBtn" class="btn btn-secondary">Restart</button>
            <button id="strictBtn" class="btn btn-strict">Strict Mode: OFF</button>
            <button id="darkModeBtn" class="btn btn-dark">🌙</button>
        </div>

        <div class="score-board">
            <div class="score-item">
                <span class="label">Score:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">Round:</span>
                <span id="round" class="value">1</span>
            </div>
            <div class="score-item">
                <span class="label">High Score:</span>
                <span id="highScore" class="value">0</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <span id="progressText" class="progress-text">Press Start to Begin</span>
        </div>

        <div class="game-board">
            <div class="button button-green" data-color="green"></div>
            <div class="button button-red" data-color="red"></div>
            <div class="button button-yellow" data-color="yellow"></div>
            <div class="button button-blue" data-color="blue"></div>
        </div>

        <div class="status-message" id="statusMessage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
